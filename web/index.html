<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
        <title>ZORTING</title>
        <style>
            body {
                margin: 0;
                padding: 0;
            }

            #canvas {
                border: 0px none;
            }

            #clickwall {
                position: absolute;
                width: 100vw;
                height: 100vh;
                background: black;
                z-index: 1000;
            }

            #clickwall>p {
                font-family: monospace;
                font-weight: bold;
                position: absolute;
                color: white;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
        </style>
    </head>
    <body>
        <div id="clickwall" onclick="loadIndex(); document.body.removeChild(this)"><p>[click anywhere to begin]</p></div>
        <canvas
            class="emscripten"
            id="canvas"
            oncontextmenu="event.preventDefault()"
            tabindex="-1"
        ></canvas>
        <script>
            function loadIndex() {
                const script = document.createElement("script");
                script.src = "./index.js";
                script.async = true;
                document.body.appendChild(script);
            }

            var Module = {
                canvas: (() => {
                    var e = document.getElementById("canvas");
                    return (
                        e.addEventListener(
                            "webglcontextlost",
                            (e) => {
                                alert(
                                    "WebGL context lost. You will need to reload the page.",
                                ),
                                    e.preventDefault();
                            },
                            !1,
                        ),
                        e
                    );
                })(),
                totalDependencies: 0
            };
        </script>
    </body>
</html>
